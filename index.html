<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스터디 플래너 - 대학생 학습 일정 관리</title>
<style>
:root{
  --bg:#f4f9ff; --card:#ffffff; --line:#e3eefa;
  --primary:#7fbcf0; --primary-d:#4a9ae0; --primary-l:#e8f3fd;
  --text:#2b4259; --sub:#7a90a6;
  --c-class:#7fbcf0; --c-assign:#8fd6c4; --c-exam:#f2a4ae;
  --danger:#e57b88; --radius:16px;
  --shadow:0 4px 18px rgba(100,160,220,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.header-in{max-width:1000px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:1.2rem;font-weight:800;color:var(--primary-d);display:flex;align-items:center;gap:8px}
.logo span.dot{width:28px;height:28px;border-radius:9px;background:var(--primary-l);display:grid;place-items:center;font-size:1rem}
.spacer{flex:1}
.today-label{font-size:.85rem;color:var(--sub)}
.bell{position:relative;background:var(--primary-l);border-radius:12px;padding:7px 12px;font-size:.85rem;color:var(--primary-d);font-weight:600}
.bell.on{background:var(--primary);color:#fff}
nav{max-width:1000px;margin:0 auto;display:flex;gap:6px;padding:0 16px 10px}
nav button{flex:1;padding:10px 6px;border-radius:12px;font-weight:600;color:var(--sub);background:transparent;position:relative}
nav button.active{background:var(--primary-l);color:var(--primary-d)}
nav .badge{position:absolute;top:2px;right:10%;background:var(--danger);color:#fff;border-radius:10px;font-size:.68rem;padding:0 6px;min-width:18px}
main{max-width:1000px;margin:0 auto;padding:16px}
.view{display:none}.view.active{display:block}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;border:1px solid var(--line)}
.card h2{font-size:1.05rem;margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h2 small{font-weight:500;color:var(--sub);font-size:.8rem}
.btn{padding:9px 16px;border-radius:12px;font-weight:600;background:var(--primary);color:#fff;transition:.15s}
.btn:hover{background:var(--primary-d)}
.btn.ghost{background:var(--primary-l);color:var(--primary-d)}
.btn.ghost:hover{background:#d8eafb}
.btn.danger{background:#fdecee;color:var(--danger)}
.btn.small{padding:5px 10px;font-size:.8rem;border-radius:9px}
.icon-btn{padding:6px 10px;border-radius:10px;background:var(--primary-l);color:var(--primary-d)}
.icon-btn:hover{background:#d8eafb}
/* alert */
.alert-list{display:flex;flex-direction:column;gap:8px}
.alert-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#fff8f0;border:1px solid #fbe6cf}
.alert-item.exam{background:#fff3f4;border-color:#f9d6da}
.dday{font-weight:800;font-size:.85rem;padding:3px 10px;border-radius:20px;background:#fff;color:var(--danger);border:1px solid currentColor;white-space:nowrap}
.alert-empty{color:var(--sub);font-size:.92rem;padding:6px 2px}
.alert-set{font-size:.8rem;color:var(--sub);display:flex;align-items:center;gap:6px}
.alert-set select{border:1px solid var(--line);border-radius:8px;padding:2px 6px;background:#fff}
/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-size:1.05rem}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:.78rem;color:var(--sub);padding:4px 0}
.cal-cell{aspect-ratio:1/1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#fafcff;font-size:.9rem;border:1px solid transparent;position:relative}
.cal-cell:hover{background:var(--primary-l)}
.cal-cell.empty{background:transparent;pointer-events:none}
.cal-cell.today{border-color:var(--primary)}
.cal-cell.sel{background:var(--primary);color:#fff}
.cal-cell.sun{color:#e08a95}.cal-cell.sel.sun{color:#fff}
.dots{display:flex;gap:2px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.legend{display:flex;gap:12px;margin-top:10px;font-size:.78rem;color:var(--sub);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#fafcff;border:1px solid var(--line)}
.item .bar{width:5px;align-self:stretch;border-radius:4px}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;word-break:break-word}
.item .m{font-size:.8rem;color:var(--sub);word-break:break-word}
.tag{font-size:.72rem;padding:2px 8px;border-radius:20px;color:#fff;font-weight:600;margin-right:6px;vertical-align:middle}
.item .acts{display:flex;gap:4px}
.empty-msg{text-align:center;color:var(--sub);padding:18px 0;font-size:.92rem}
.chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:20px;background:var(--primary-l);color:var(--primary-d);font-size:.82rem;font-weight:600}
.chip.active{background:var(--primary);color:#fff}
/* form */
.form-row{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;padding:10px 12px;border:1px solid #d5e5f5;border-radius:12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(127,188,240,.25)}
label{display:block;font-size:.82rem;color:var(--sub);margin:10px 0 4px}
.modal-bg{position:fixed;inset:0;background:rgba(43,66,89,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:440px;max-height:92vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h3{margin-bottom:6px}
.modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
/* goals */
.date-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.date-nav b{flex:1;text-align:center;min-width:140px}
.goal-form{display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin-bottom:14px}
.goal-item input[type=checkbox]{width:22px;height:22px;accent-color:var(--primary-d);flex:none}
.goal-item.done .t{text-decoration:line-through;color:var(--sub)}
.progress{height:12px;background:var(--primary-l);border-radius:10px;overflow:hidden;margin:8px 0 4px}
.progress div{height:100%;background:linear-gradient(90deg,#a9d6f7,var(--primary-d));border-radius:10px;transition:width .4s}
.sum-line{display:flex;justify-content:space-between;font-size:.85rem;color:var(--sub)}
/* progress view */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--primary-l);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.3rem;color:var(--primary-d)}
.stat span{font-size:.78rem;color:var(--sub)}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center}
.donut{position:relative;width:150px;height:150px}
.donut .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:1.9rem;font-weight:800;color:var(--primary-d)}
.chart svg{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--sub);font-weight:600}
tr.today-row td{background:var(--primary-l)}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-120px);background:#fff;border:1px solid var(--primary);color:var(--text);padding:12px 18px;border-radius:14px;box-shadow:var(--shadow);z-index:100;transition:.4s;max-width:92vw;font-size:.9rem}
.toast.show{transform:translate(-50%,0)}
/* responsive */
@media (max-width:820px){
  .grid2{grid-template-columns:1fr}
}
@media (max-width:720px){
  nav{position:fixed;bottom:0;left:0;right:0;max-width:none;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:30}
  .today-label{display:none}
  .goal-form{grid-template-columns:1fr 90px}
  .goal-form .btn{grid-column:1/-1}
  .stat b{font-size:1.1rem}
}
</style>
</head>
<body>

<header>
  <div class="header-in">
    <div class="logo"><span class="dot">📘</span>스터디 플래너</div>
    <div class="spacer"></div>
    <div class="today-label" id="todayLabel"></div>
    <button class="bell" id="bellBtn" title="브라우저 알림 켜기">🔔 알림 켜기</button>
  </div>
  <nav id="nav">
    <button data-view="schedule" class="active">📅 일정<span class="badge" id="navBadge" style="display:none">0</span></button>
    <button data-view="goals">✅ 오늘 목표</button>
    <button data-view="progress">📊 진행 상황</button>
  </nav>
</header>

<main>
  <!-- 일정 -->
  <section class="view active" id="view-schedule">
    <div class="card">
      <h2>⏰ 다가오는 과제·시험
        <span class="alert-set">알림 범위
          <select id="alertDays">
            <option value="1">1일 전</option>
            <option value="3">3일 전</option>
            <option value="7">7일 전</option>
            <option value="14">14일 전</option>
          </select>
        </span>
      </h2>
      <div class="alert-list" id="alertList"></div>
    </div>

    <div class="grid2">
      <div>
        <div class="card">
          <div class="cal-head">
            <button class="icon-btn" id="prevMonth" aria-label="이전 달">◀</button>
            <b id="calTitle"></b>
            <button class="icon-btn" id="nextMonth" aria-label="다음 달">▶</button>
          </div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="legend">
            <span><i style="background:var(--c-class)"></i>수업</span>
            <span><i style="background:var(--c-assign)"></i>과제</span>
            <span><i style="background:var(--c-exam)"></i>시험</span>
          </div>
        </div>
      </div>
      <div>
        <div class="card">
          <h2><span id="selTitle">선택한 날짜</span><button class="btn small" id="addEventBtn">＋ 일정 추가</button></h2>
          <div class="list" id="dayList"></div>
        </div>
        <div class="card">
          <h2>📋 전체 일정 <small>날짜순</small></h2>
          <div class="chips" id="filterChips">
            <button class="chip active" data-f="all">전체</button>
            <button class="chip" data-f="class">수업</button>
            <button class="chip" data-f="assign">과제</button>
            <button class="chip" data-f="exam">시험</button>
          </div>
          <div class="list" id="allList"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 목표 -->
  <section class="view" id="view-goals">
    <div class="card">
      <h2>🎯 하루 학습 목표</h2>
      <div class="date-nav">
        <button class="icon-btn" id="gPrev">◀</button>
        <b id="gTitle"></b>
        <button class="icon-btn" id="gNext">▶</button>
        <button class="btn ghost small" id="gToday">오늘</button>
      </div>
      <div class="goal-form">
        <input type="text" id="gInput" placeholder="예) 경제학 3장 복습" maxlength="60">
        <input type="number" id="gMin" placeholder="목표(분)" min="0" max="1440">
        <button class="btn" id="gSave">추가</button>
      </div>
      <div id="gEditNote" style="display:none;font-size:.82rem;color:var(--primary-d);margin:-6px 0 10px">✏️ 수정 중입니다. <button class="btn small ghost" id="gCancel">취소</button></div>
      <div class="progress"><div id="gBar" style="width:0"></div></div>
      <div class="sum-line"><span id="gSum">0 / 0 완료</span><span id="gPct">0%</span></div>
    </div>
    <div class="card">
      <div class="list" id="goalList"></div>
    </div>
  </section>

  <!-- 진행 상황 -->
  <section class="view" id="view-progress">
    <div class="grid2">
      <div class="card">
        <h2>오늘의 달성률</h2>
        <div class="donut-wrap">
          <div class="donut" id="donutBox"></div>
          <div style="flex:1;min-width:150px">
            <div class="sum-line" style="font-size:.95rem;color:var(--text)"><span>완료한 목표</span><b id="pDone">0</b></div>
            <div class="sum-line" style="font-size:.95rem;color:var(--text);margin-top:6px"><span>전체 목표</span><b id="pTotal">0</b></div>
            <div class="sum-line" style="font-size:.95rem;color:var(--text);margin-top:6px"><span>학습 시간</span><b id="pMin">0 / 0분</b></div>
          </div>
        </div>
      </div>
      <div class="card">
        <h2>이번 주 요약</h2>
        <div class="stat-row">
          <div class="stat"><b id="wRate">0%</b><span>주간 달성률</span></div>
          <div class="stat"><b id="wDone">0/0</b><span>완료/전체</span></div>
          <div class="stat"><b id="wMin">0분</b><span>완료 학습시간</span></div>
        </div>
        <div class="stat-row" style="grid-template-columns:repeat(2,1fr)">
          <div class="stat"><b id="wBest">-</b><span>가장 잘한 요일</span></div>
          <div class="stat"><b id="wStreak">0일</b><span>연속 달성(80%↑)</span></div>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>주간 달성률 그래프
        <span style="display:flex;gap:6px;align-items:center">
          <button class="icon-btn" id="wPrev">◀</button>
          <small id="wRange"></small>
          <button class="icon-btn" id="wNext">▶</button>
        </span>
      </h2>
      <div class="chart" id="weekChart"></div>
      <div style="overflow-x:auto;margin-top:12px">
        <table>
          <thead><tr><th>요일</th><th>날짜</th><th>완료/전체</th><th>달성률</th></tr></thead>
          <tbody id="weekTable"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<!-- 일정 모달 -->
<div class="modal-bg" id="modalBg">
  <form class="modal" id="eventForm">
    <h3 id="modalTitle">일정 추가</h3>
    <label for="eTitle">제목</label>
    <input type="text" id="eTitle" placeholder="예) 자료구조 중간고사" maxlength="60" required>
    <div class="row2">
      <div>
        <label for="eType">종류</label>
        <select id="eType">
          <option value="class">수업</option>
          <option value="assign">과제</option>
          <option value="exam">시험</option>
        </select>
      </div>
      <div>
        <label for="eDate">날짜</label>
        <input type="date" id="eDate" required>
      </div>
    </div>
    <label for="eTime">시간 (선택)</label>
    <input type="time" id="eTime">
    <label for="eMemo">메모 (선택)</label>
    <textarea id="eMemo" rows="2" maxlength="200" placeholder="강의실, 제출 방법, 시험 범위 등"></textarea>
    <div class="foot">
      <button type="button" class="btn danger" id="eDelete" style="display:none;margin-right:auto">삭제</button>
      <button type="button" class="btn ghost" id="eCancel">취소</button>
      <button type="submit" class="btn">저장</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const pad = n => String(n).padStart(2,'0');
  const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parse = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
  const addDays = (k,n) => { const d = parse(k); d.setDate(d.getDate()+n); return key(d); };
  const diffDays = (a,b) => Math.round((parse(a)-parse(b))/86400000);
  const DOW = ['일','월','화','수','목','금','토'];
  const TYPES = {
    class:{label:'수업',color:'var(--c-class)'},
    assign:{label:'과제',color:'var(--c-assign)'},
    exam:{label:'시험',color:'var(--c-exam)'}
  };
  const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const fmtDate = k => { const d = parse(k); return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`; };

  /* ---------- 저장소 ---------- */
  const STORE = 'studyPlannerV1';
  let state = load();
  function load(){
    try{
      const s = JSON.parse(localStorage.getItem(STORE));
      if(s && s.events && s.goals) return s;
    }catch(e){}
    const t = key(new Date());
    return {
      events:[
        {id:uid(),title:'경영학원론 수업',type:'class',date:t,time:'10:00',memo:'공학관 201호'},
        {id:uid(),title:'통계학 과제 제출',type:'assign',date:addDays(t,2),time:'23:59',memo:'e-클래스 업로드'},
        {id:uid(),title:'자료구조 중간고사',type:'exam',date:addDays(t,5),time:'13:00',memo:'1~6장'}
      ],
      goals:[
        {id:uid(),title:'영어 단어 30개 암기',date:t,minutes:30,done:true},
        {id:uid(),title:'통계학 과제 풀이',date:t,minutes:90,done:false},
        {id:uid(),title:'자료구조 1장 복습',date:t,minutes:60,done:false}
      ],
      settings:{alertDays:3},
      notified:[]
    };
  }
  function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }
  state.settings = state.settings || {alertDays:3};
  state.notified = state.notified || [];

  /* ---------- 상태 ---------- */
  const today = () => key(new Date());
  let selDate = today();
  let cal = {y:new Date().getFullYear(), m:new Date().getMonth()};
  let filter = 'all';
  let goalDate = today();
  let editingGoal = null;
  let editingEvent = null;
  let weekStart = mondayOf(today());

  function mondayOf(k){
    const d = parse(k); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return key(d);
  }

  /* ---------- 토스트 ---------- */
  let toastTimer;
  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 4200);
  }

  /* ---------- 탭 ---------- */
  $('#nav').addEventListener('click', e=>{
    const b = e.target.closest('button[data-view]'); if(!b) return;
    $$('#nav button').forEach(x=>x.classList.toggle('active', x===b));
    $$('.view').forEach(v=>v.classList.toggle('active', v.id==='view-'+b.dataset.view));
    renderAll(); window.scrollTo({top:0});
  });

  /* ---------- 알림 ---------- */
  function upcoming(){
    const t = today(), n = Number(state.settings.alertDays);
    return state.events
      .filter(e => (e.type==='assign'||e.type==='exam'))
      .map(e => ({...e, diff:diffDays(e.date,t)}))
      .filter(e => e.diff>=0 && e.diff<=n)
      .sort((a,b)=> a.diff-b.diff || (a.time||'').localeCompare(b.time||''));
  }
  const ddayText = d => d===0 ? 'D-Day' : 'D-'+d;
  function renderAlerts(){
    $('#alertDays').value = String(state.settings.alertDays);
    const list = upcoming();
    const box = $('#alertList');
    if(!list.length){ box.innerHTML = '<div class="alert-empty">임박한 과제·시험이 없어요 🎉</div>'; }
    else box.innerHTML = list.map(e=>`
      <div class="alert-item ${e.type}">
        <span class="dday">${ddayText(e.diff)}</span>
        <div class="body" style="flex:1;min-width:0">
          <div class="t" style="font-weight:600"><span class="tag" style="background:${TYPES[e.type].color}">${TYPES[e.type].label}</span>${esc(e.title)}</div>
          <div class="m" style="font-size:.8rem;color:var(--sub)">${fmtDate(e.date)} ${esc(e.time||'')}</div>
        </div>
      </div>`).join('');
    const nb = $('#navBadge');
    nb.style.display = list.length ? '' : 'none'; nb.textContent = list.length;
  }
  $('#alertDays').addEventListener('change', e=>{ state.settings.alertDays = Number(e.target.value); save(); renderAlerts(); fireNotifications(true); });

  function bellUpdate(){
    const b = $('#bellBtn');
    if(!('Notification' in window)){ b.style.display='none'; return; }
    if(Notification.permission==='granted'){ b.textContent='🔔 알림 켜짐'; b.classList.add('on'); }
    else if(Notification.permission==='denied'){ b.textContent='🔕 알림 차단됨'; b.classList.remove('on'); }
    else { b.textContent='🔔 알림 켜기'; b.classList.remove('on'); }
  }
  $('#bellBtn').addEventListener('click', ()=>{
    if(!('Notification' in window)) return;
    if(Notification.permission==='default'){
      Notification.requestPermission().then(()=>{ bellUpdate(); fireNotifications(false); });
    } else if(Notification.permission==='denied'){
      toast('브라우저 설정에서 이 페이지의 알림을 허용해 주세요.');
    } else { toast('이미 알림이 켜져 있어요. 앱을 열어 둔 동안 알려드립니다.'); }
  });
  function fireNotifications(silent){
    const list = upcoming();
    state.notified = state.notified.filter(k => k.startsWith(today()));
    list.forEach(e=>{
      const k = `${today()}|${e.id}`;
      if(state.notified.includes(k)) return;
      if('Notification' in window && Notification.permission==='granted'){
        try{ new Notification(`[${TYPES[e.type].label}] ${e.title}`, {body:`${ddayText(e.diff)} · ${fmtDate(e.date)} ${e.time||''}`}); }catch(err){}
        state.notified.push(k);
      }
    });
    save();
  }
  setInterval(()=>{ fireNotifications(true); renderAlerts(); }, 60*1000);

  /* ---------- 캘린더 ---------- */
  function renderCalendar(){
    $('#calTitle').textContent = `${cal.y}년 ${cal.m+1}월`;
    const first = new Date(cal.y, cal.m, 1).getDay();
    const days = new Date(cal.y, cal.m+1, 0).getDate();
    let html = DOW.map((d,i)=>`<div class="cal-dow" style="${i===0?'color:#e08a95':''}">${d}</div>`).join('');
    for(let i=0;i<first;i++) html += '<div class="cal-cell empty"></div>';
    for(let d=1; d<=days; d++){
      const k = `${cal.y}-${pad(cal.m+1)}-${pad(d)}`;
      const types = [...new Set(state.events.filter(e=>e.date===k).map(e=>e.type))];
      const dow = new Date(cal.y,cal.m,d).getDay();
      html += `<button class="cal-cell ${k===today()?'today':''} ${k===selDate?'sel':''} ${dow===0?'sun':''}" data-date="${k}">
        <span>${d}</span><span class="dots">${types.map(t=>`<i style="background:${TYPES[t].color};${k===selDate?'box-shadow:0 0 0 1px #fff':''}"></i>`).join('')}</span></button>`;
    }
    $('#calGrid').innerHTML = html;
  }
  $('#calGrid').addEventListener('click', e=>{
    const c = e.target.closest('[data-date]'); if(!c) return;
    selDate = c.dataset.date; renderSchedule();
  });
  $('#prevMonth').onclick = ()=>{ cal.m--; if(cal.m<0){cal.m=11;cal.y--;} renderCalendar(); };
  $('#nextMonth').onclick = ()=>{ cal.m++; if(cal.m>11){cal.m=0;cal.y++;} renderCalendar(); };

  function eventItem(e, showDate){
    const t = TYPES[e.type];
    return `<div class="item">
      <div class="bar" style="background:${t.color}"></div>
      <div class="body">
        <div class="t"><span class="tag" style="background:${t.color}">${t.label}</span>${esc(e.title)}</div>
        <div class="m">${showDate?fmtDate(e.date)+' ':''}${esc(e.time||'')}${e.memo?' · '+esc(e.memo):''}</div>
      </div>
      <div class="acts">
        <button class="icon-btn" data-edit="${e.id}" aria-label="수정">✏️</button>
        <button class="icon-btn" data-del="${e.id}" aria-label="삭제">🗑️</button>
      </div></div>`;
  }
  function sortEv(a,b){ return a.date.localeCompare(b.date) || (a.time||'99').localeCompare(b.time||'99'); }
  function renderSchedule(){
    renderAlerts(); renderCalendar();
    $('#selTitle').textContent = fmtDate(selDate) + (selDate===today()?' · 오늘':'');
    const day = state.events.filter(e=>e.date===selDate).sort(sortEv);
    $('#dayList').innerHTML = day.length ? day.map(e=>eventItem(e,false)).join('') : '<div class="empty-msg">이 날은 등록된 일정이 없어요.</div>';
    const all = state.events.filter(e=>filter==='all'||e.type===filter).sort(sortEv);
    $('#allList').innerHTML = all.length ? all.map(e=>eventItem(e,true)).join('') : '<div class="empty-msg">등록된 일정이 없어요.</div>';
  }
  $('#filterChips').addEventListener('click', e=>{
    const c = e.target.closest('.chip'); if(!c) return;
    filter = c.dataset.f; $$('#filterChips .chip').forEach(x=>x.classList.toggle('active',x===c)); renderSchedule();
  });
  document.addEventListener('click', e=>{
    const ed = e.target.closest('[data-edit]'); if(ed){ openEvent(ed.dataset.edit); return; }
    const dl = e.target.closest('[data-del]');
    if(dl && confirm('이 일정을 삭제할까요?')){
      state.events = state.events.filter(x=>x.id!==dl.dataset.del); save(); renderAll(); toast('일정을 삭제했어요.');
    }
  });

  /* ---------- 일정 모달 ---------- */
  function openEvent(id){
    editingEvent = id || null;
    const ev = id ? state.events.find(x=>x.id===id) : null;
    $('#modalTitle').textContent = ev ? '일정 수정' : '일정 추가';
    $('#eTitle').value = ev?ev.title:'';
    $('#eType').value = ev?ev.type:'class';
    $('#eDate').value = ev?ev.date:selDate;
    $('#eTime').value = ev?(ev.time||''):'';
    $('#eMemo').value = ev?(ev.memo||''):'';
    $('#eDelete').style.display = ev ? '' : 'none';
    $('#modalBg').classList.add('show');
    setTimeout(()=>$('#eTitle').focus(),50);
  }
  function closeEvent(){ $('#modalBg').classList.remove('show'); editingEvent=null; }
  $('#addEventBtn').onclick = ()=>openEvent();
  $('#eCancel').onclick = closeEvent;
  $('#modalBg').addEventListener('mousedown', e=>{ if(e.target.id==='modalBg') closeEvent(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeEvent(); });
  $('#eDelete').onclick = ()=>{
    if(editingEvent && confirm('이 일정을 삭제할까요?')){
      state.events = state.events.filter(x=>x.id!==editingEvent); save(); closeEvent(); renderAll(); toast('일정을 삭제했어요.');
    }
  };
  $('#eventForm').addEventListener('submit', e=>{
    e.preventDefault();
    const title = $('#eTitle').value.trim(), date = $('#eDate').value;
    if(!title || !date) return;
    const data = {title, type:$('#eType').value, date, time:$('#eTime').value, memo:$('#eMemo').value.trim()};
    if(editingEvent){
      const ev = state.events.find(x=>x.id===editingEvent); Object.assign(ev, data);
      toast('일정을 수정했어요.');
    } else {
      state.events.push({id:uid(), ...data}); toast('일정을 추가했어요.');
    }
    selDate = date; const d = parse(date); cal = {y:d.getFullYear(), m:d.getMonth()};
    save(); closeEvent(); renderAll(); fireNotifications(true);
  });

  /* ---------- 목표 ---------- */
  const goalsOf = k => state.goals.filter(g=>g.date===k);
  function stat(k){
    const g = goalsOf(k), done = g.filter(x=>x.done);
    return {total:g.length, done:done.length, rate:g.length?Math.round(done.length/g.length*100):0,
      min:g.reduce((s,x)=>s+(x.minutes||0),0), doneMin:done.reduce((s,x)=>s+(x.minutes||0),0)};
  }
  function renderGoals(){
    $('#gTitle').textContent = fmtDate(goalDate) + (goalDate===today()?' · 오늘':'');
    const g = goalsOf(goalDate), s = stat(goalDate);
    $('#goalList').innerHTML = g.length ? g.map(x=>`
      <div class="item goal-item ${x.done?'done':''}">
        <input type="checkbox" data-gcheck="${x.id}" ${x.done?'checked':''} aria-label="완료 체크">
        <div class="body"><div class="t">${esc(x.title)}</div>${x.minutes?`<div class="m">목표 ${x.minutes}분</div>`:''}</div>
        <div class="acts">
          <button class="icon-btn" data-gedit="${x.id}" aria-label="수정">✏️</button>
          <button class="icon-btn" data-gdel="${x.id}" aria-label="삭제">🗑️</button>
        </div></div>`).join('') : '<div class="empty-msg">이 날의 학습 목표를 추가해 보세요.</div>';
    $('#gBar').style.width = s.rate+'%';
    $('#gSum').textContent = `${s.done} / ${s.total} 완료`;
    $('#gPct').textContent = s.rate+'%';
    $('#gSave').textContent = editingGoal ? '수정 완료' : '추가';
    $('#gEditNote').style.display = editingGoal ? '' : 'none';
  }
  function resetGoalForm(){ editingGoal=null; $('#gInput').value=''; $('#gMin').value=''; }
  function saveGoal(){
    const title = $('#gInput').value.trim(); if(!title){ $('#gInput').focus(); return; }
    const minutes = Math.max(0, parseInt($('#gMin').value)||0);
    if(editingGoal){ const g = state.goals.find(x=>x.id===editingGoal); g.title=title; g.minutes=minutes; }
    else state.goals.push({id:uid(), title, date:goalDate, minutes, done:false});
    resetGoalForm(); save(); renderGoals();
  }
  $('#gSave').onclick = saveGoal;
  $('#gInput').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); saveGoal(); } });
  $('#gMin').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); saveGoal(); } });
  $('#gCancel').onclick = ()=>{ resetGoalForm(); renderGoals(); };
  $('#gPrev').onclick = ()=>{ goalDate = addDays(goalDate,-1); resetGoalForm(); renderGoals(); };
  $('#gNext').onclick = ()=>{ goalDate = addDays(goalDate,1); resetGoalForm(); renderGoals(); };
  $('#gToday').onclick = ()=>{ goalDate = today(); resetGoalForm(); renderGoals(); };
  $('#goalList').addEventListener('click', e=>{
    const ed = e.target.closest('[data-gedit]');
    if(ed){ const g = state.goals.find(x=>x.id===ed.dataset.gedit); editingGoal=g.id; $('#gInput').value=g.title; $('#gMin').value=g.minutes||''; renderGoals(); $('#gInput').focus(); return; }
    const dl = e.target.closest('[data-gdel]');
    if(dl && confirm('이 목표를 삭제할까요?')){
      state.goals = state.goals.filter(x=>x.id!==dl.dataset.gdel);
      if(editingGoal===dl.dataset.gdel) resetGoalForm();
      save(); renderGoals();
    }
  });
  $('#goalList').addEventListener('change', e=>{
    const c = e.target.closest('[data-gcheck]'); if(!c) return;
    state.goals.find(x=>x.id===c.dataset.gcheck).done = c.checked; save(); renderGoals();
  });

  /* ---------- 진행 상황 ---------- */
  function renderProgress(){
    const s = stat(today());
    const R = 60, C = 2*Math.PI*R;
    $('#donutBox').innerHTML = `
      <svg viewBox="0 0 150 150" width="150" height="150">
        <circle cx="75" cy="75" r="${R}" fill="none" stroke="#e8f3fd" stroke-width="16"/>
        <circle cx="75" cy="75" r="${R}" fill="none" stroke="#5aa9e6" stroke-width="16" stroke-linecap="round"
          stroke-dasharray="${C*s.rate/100} ${C}" transform="rotate(-90 75 75)" style="transition:stroke-dasharray .6s"/>
      </svg><div class="pct">${s.rate}%</div>`;
    $('#pDone').textContent = s.done; $('#pTotal').textContent = s.total;
    $('#pMin').textContent = `${s.doneMin} / ${s.min}분`;

    const days = Array.from({length:7},(_,i)=>addDays(weekStart,i));
    const st = days.map(stat);
    $('#wRange').textContent = `${fmtDate(days[0]).replace(/ \(.\)/,'')} ~ ${fmtDate(days[6]).replace(/ \(.\)/,'')}`;
    const tot = st.reduce((a,x)=>a+x.total,0), dn = st.reduce((a,x)=>a+x.done,0);
    $('#wRate').textContent = (tot?Math.round(dn/tot*100):0)+'%';
    $('#wDone').textContent = `${dn}/${tot}`;
    $('#wMin').textContent = st.reduce((a,x)=>a+x.doneMin,0)+'분';
    let best=-1,bi=-1; st.forEach((x,i)=>{ if(x.total && x.rate>best){best=x.rate;bi=i;} });
    $('#wBest').textContent = bi>=0 ? `${DOW[parse(days[bi]).getDay()]}요일 ${best}%` : '-';
    let streak=0; for(let k=today(); ; k=addDays(k,-1)){ const x=stat(k); if(x.total && x.rate>=80) streak++; else if(k===today() && streak===0){ continue; } else break; if(streak>365) break; }
    $('#wStreak').textContent = streak+'일';

    // 막대 그래프
    const W=700,H=260,pl=40,pb=40,pt=20,bw=44;
    const cw=(W-pl-10)/7;
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="주간 달성률 막대 그래프">`;
    [0,25,50,75,100].forEach(v=>{
      const y = pt + (H-pt-pb)*(1-v/100);
      svg += `<line x1="${pl}" x2="${W-10}" y1="${y}" y2="${y}" stroke="#e3eefa"/><text x="${pl-8}" y="${y+4}" font-size="11" fill="#7a90a6" text-anchor="end">${v}%</text>`;
    });
    st.forEach((x,i)=>{
      const cx = pl + cw*i + cw/2, h = (H-pt-pb)*x.rate/100, y = H-pb-h;
      const isToday = days[i]===today();
      svg += `<rect x="${cx-bw/2}" y="${H-pb-(H-pt-pb)}" width="${bw}" height="${H-pt-pb}" rx="10" fill="#f4f9ff"/>`;
      if(h>0) svg += `<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${h}" rx="10" fill="${isToday?'#4a9ae0':'#9ccdf4'}"/>`;
      svg += `<text x="${cx}" y="${Math.max(y-6,pt-4)}" font-size="12" font-weight="700" fill="#2b4259" text-anchor="middle">${x.total?x.rate+'%':'-'}</text>`;
      svg += `<text x="${cx}" y="${H-pb+18}" font-size="12" fill="${isToday?'#4a9ae0':'#7a90a6'}" font-weight="${isToday?700:400}" text-anchor="middle">${DOW[parse(days[i]).getDay()]}</text>`;
      svg += `<text x="${cx}" y="${H-pb+33}" font-size="10" fill="#9bb0c4" text-anchor="middle">${parse(days[i]).getDate()}일</text>`;
    });
    svg += '</svg>';
    $('#weekChart').innerHTML = svg;
    $('#weekTable').innerHTML = days.map((k,i)=>`<tr class="${k===today()?'today-row':''}"><td>${DOW[parse(k).getDay()]}</td><td>${parse(k).getMonth()+1}/${parse(k).getDate()}</td><td>${st[i].done}/${st[i].total}</td><td><b>${st[i].total?st[i].rate+'%':'-'}</b></td></tr>`).join('');
  }
  $('#wPrev').onclick = ()=>{ weekStart = addDays(weekStart,-7); renderProgress(); };
  $('#wNext').onclick = ()=>{ weekStart = addDays(weekStart,7); renderProgress(); };

  /* ---------- 전체 렌더 ---------- */
  function renderAll(){
    const active = document.querySelector('.view.active').id;
    renderAlerts();
    if(active==='view-schedule') renderSchedule();
    if(active==='view-goals') renderGoals();
    if(active==='view-progress') renderProgress();
  }

  /* ---------- 시작 ---------- */
  $('#todayLabel').textContent = '오늘 ' + fmtDate(today());
  bellUpdate(); save(); renderAll();
  const up = upcoming();
  if(up.length){
    const f = up[0];
    toast(`⏰ ${TYPES[f.type].label} "${f.title}" ${ddayText(f.diff)}${up.length>1?` 외 ${up.length-1}건`:''}`);
  }
  fireNotifications(true);
})();
</script>
</body>
</html>
